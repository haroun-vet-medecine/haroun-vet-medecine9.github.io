<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haroun Vet Medicine Logo</title>
    <style>
        /* إعدادات الخلفية والعرض */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: 'Arial Black', 'Arial', sans-serif;
        }

        .logo-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* تنسيق النصوص السفلية ليتطابق مع الشعار */
        .brand-name {
            color: #f18f1c; /* اللون البرتقالي للشعار */
            font-size: 48px;
            font-weight: 900;
            margin: 10px 0 0 0;
            letter-spacing: -1px;
            line-height: 1;
        }

        .brand-subtitle {
            color: #0b6cb3; /* اللون الأزرق للشعار */
            font-size: 18px;
            font-weight: bold;
            margin: 5px 0 0 0;
            letter-spacing: 1px;
            word-spacing: 3px;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="auto">
            <path d="M50,40 L140,40 L140,110 L180,110 L180,40 L250,40 L250,230 L180,230 L180,150 L140,150 L140,230 L50,230 Z" fill="#0b6cb3"/>
            
            <path d="M165,40 L250,40 L250,230 L165,230 Z" fill="#f18f1c"/>
            
            <rect x="115" y="40" width="70" height="70" fill="#ffffff"/>
            
            <g stroke="#0b6cb3" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
                <path d="M130,55 C125,45 135,40 142,50 C145,55 142,70 150,85 C158,70 155,55 158,50 C165,40 175,45 170,55" />
                <path d="M135,70 L142,70 L142,62" />
                <path d="M165,70 L158,70 L158,62" />
                <path d="M142,78 L150,92 L158,78" />
                <path d="M132,65 C122,62 122,72 134,71" />
                <path d="M168,65 C178,62 178,72 166,71" />
            </g>

            <path d="M150,115 
                     C160,110 168,115 173,122 
                     C175,118 180,118 181,123 
                     C185,123 186,128 182,132 
                     C186,134 188,138 184,142
                     L189,144 L181,148
                     C175,155 185,175 170,195
                     C155,210 145,210 140,190
                     C130,205 115,200 105,190
                     C90,175 95,155 105,145
                     C90,155 85,145 95,135
                     C105,125 120,125 132,135
                     C138,125 145,118 150,115 Z" 
                  fill="#ffffff"/>
            
            <circle cx="178" cy="135" r="2.5" fill="#f18f1c"/>
        </svg>

        <h1 class="brand-name">Haroun</h1>
        <p class="brand-subtitle">VET MEDICINE</p>
    </div>

</body>
</html>
